<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="SouloSpotter">
  <rect width="512" height="512" rx="96" fill="#1F2D3D"/>
  <g transform="translate(256 214)">
    <circle cx="0" cy="0" r="132" fill="none" stroke="#F0A500" stroke-width="12"/>
    <!-- compass needle: north (gold), south (muted) -->
