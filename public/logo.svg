  </g>
  <text x="256" y="430" text-anchor="middle" font-family="Georgia, 'Playfair Display', serif" font-size="62" font-weight="700">
    <tspan fill="#FAFAF8">Soulo</tspan><tspan fill="#F0A500">Spotter</tspan>
  </text>
</svg>
